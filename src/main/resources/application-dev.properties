# Banco local executado pelo compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/icones_catolicos}
spring.datasource.username=${DB_USERNAME:icones_app}
spring.datasource.password=${DB_PASSWORD:icones_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# Durante o desenvolvimento, o Spring Boot pode iniciar e parar o Compose.
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop

spring.jpa.show-sql=true

# Administrador inicial exclusivo do ambiente de desenvolvimento.
app.admin-inicial.nome=${ADMIN_INICIAL_NOME:Administrador}
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:admin@icones.local}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:admin123}

# Carga idempotente usada nas demonstracoes academicas.
app.dados-demonstracao.enabled=${DADOS_DEMONSTRACAO_ENABLED:true}
app.dados-demonstracao.cliente-email=${CLIENTE_DEMO_EMAIL:cliente@icones.local}
app.dados-demonstracao.cliente-senha=${CLIENTE_DEMO_SENHA:cliente123}
