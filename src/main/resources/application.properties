spring.application.name=icones-catolicos-online
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

# O Flyway sera responsavel pela evolucao do banco de dados.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Impede que o Hibernate crie ou altere tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Evita inicializacao paralela por arquivos schema.sql/data.sql.
spring.sql.init.mode=never

# JWT: em producao, defina JWT_SECRET com uma chave Base64 segura e exclusiva.
app.jwt.secret=${JWT_SECRET:aWNvbmVzLWNhdG9saWNvcy1zZWdyZWRvLWp3dC0yMDI2LXNlZ3Vybw==}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Percentual aplicado automaticamente sobre o total da encomenda.
app.encomenda.percentual-sinal-minimo=${PERCENTUAL_SINAL_MINIMO:30}

# Comprovantes enviados no ambiente local. A pasta fica fora do versionamento.
app.upload.comprovantes-diretorio=${COMPROVANTES_DIRETORIO:uploads/comprovantes}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# E-mail transacional via Gmail SMTP. As credenciais devem vir do ambiente.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email.enabled=${EMAIL_ENABLED:false}
app.email.remetente=${EMAIL_REMETENTE:oficina.sao.jose.rj.oficial@gmail.com}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
