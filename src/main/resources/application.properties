spring.application.name=icones-catolicos-online

# PostgreSQL local. As variaveis permitem trocar as credenciais sem alterar o codigo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/icones_catolicos}
spring.datasource.username=${DB_USERNAME:icones_app}
spring.datasource.password=${DB_PASSWORD:icones_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Flyway sera responsavel pela evolucao do banco de dados.
spring.flyway.enabled=true

# Impede que o Hibernate crie ou altere tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Evita inicializacao paralela por arquivos schema.sql/data.sql.
spring.sql.init.mode=never
