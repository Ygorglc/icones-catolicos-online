spring.application.name=icones-catolicos-online
spring.profiles.default=dev

# O Flyway sera responsavel pela evolucao do banco de dados.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Impede que o Hibernate crie ou altere tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Evita inicializacao paralela por arquivos schema.sql/data.sql.
spring.sql.init.mode=never
