services:
  postgres:
    image: postgres:18-alpine
    container_name: icones-catolicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icones_catolicos}
      POSTGRES_USER: ${POSTGRES_USER:-icones_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icones_app}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icones_app} -d ${POSTGRES_DB:-icones_catolicos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
